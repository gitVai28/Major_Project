<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>API Test UI</title>
</head>
<body>
  <h2>Register</h2>
  <form id="registerForm">
    <input type="text" id="regName" placeholder="Name" required />
    <input type="email" id="regEmail" placeholder="Email" required />
    <input type="password" id="regPassword" placeholder="Password" required />
    <button type="submit">Register</button>
  </form>
  <pre id="registerResult"></pre>

  <h2>Verify Email</h2>
  <form id="verifyForm">
    <input type="email" id="verifyEmail" placeholder="Email" required />
    <input type="text" id="verifyOtp" placeholder="OTP" required />
    <button type="submit">Verify</button>
  </form>
  <pre id="verifyResult"></pre>

  <h2>Login</h2>
  <form id="loginForm">
    <input type="email" id="loginEmail" placeholder="Email" required />
    <input type="password" id="loginPassword" placeholder="Password" required />
    <button type="submit">Login</button>
  </form>
  <pre id="loginResult"></pre>

  <h2>Home</h2>
  <button id="homeBtn">Go to Home</button>
  <pre id="homeResult"></pre>

  <h2>Upload Profile Photo</h2>
  <form id="uploadForm" enctype="multipart/form-data">
    <input type="file" id="profilePhoto" name="profilePhoto" accept="image/*" required />
    <button type="submit">Upload</button>
  </form>
  <pre id="uploadResult"></pre>

  <script>
    const API_USERS = "http://localhost:5000/api/users";
    const API_HOME = "http://localhost:5000/api/home";

    let authToken = null; // store JWT token after login

    // Register
    document.getElementById("registerForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const res = await fetch(`${API_USERS}/register`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          name: document.getElementById("regName").value,
          email: document.getElementById("regEmail").value,
          password: document.getElementById("regPassword").value,
        }),
      });
      document.getElementById("registerResult").textContent = JSON.stringify(await res.json(), null, 2);
    });

    // Verify Email
    document.getElementById("verifyForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const res = await fetch(`${API_USERS}/verify-email`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          email: document.getElementById("verifyEmail").value,
          otp: document.getElementById("verifyOtp").value,
        }),
      });
      document.getElementById("verifyResult").textContent = JSON.stringify(await res.json(), null, 2);
    });

    // Login
    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const res = await fetch(`${API_USERS}/login`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          email: document.getElementById("loginEmail").value,
          password: document.getElementById("loginPassword").value,
        }),
      });
      const data = await res.json();
      document.getElementById("loginResult").textContent = JSON.stringify(data, null, 2);

      // Save JWT token
      if (data.token) {
        authToken = data.token;
      }
    });

    // Home (Protected route)
    document.getElementById("homeBtn").addEventListener("click", async () => {
      if (!authToken) {
        document.getElementById("homeResult").textContent = "⚠️ Please login first!";
        return;
      }
      const res = await fetch(API_HOME, {
        method: "GET",
        headers: { "Authorization": "Bearer " + authToken }
      });
      document.getElementById("homeResult").textContent = JSON.stringify(await res.json(), null, 2);
    });

    // Upload Profile Photo
    document.getElementById("uploadForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      if (!authToken) {
        document.getElementById("uploadResult").textContent = "⚠️ Please login first!";
        return;
      }

      const formData = new FormData();
      formData.append("profilePhoto", document.getElementById("profilePhoto").files[0]);

      const res = await fetch(`${API_HOME}/upload-photo`, {
        method: "POST",
        headers: {
          "Authorization": "Bearer " + authToken
        },
        body: formData
      });

      document.getElementById("uploadResult").textContent = JSON.stringify(await res.json(), null, 2);
    });
  </script>
</body>
</html>
